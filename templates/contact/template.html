<section class="lp-page lp-page-contact lp-section lp-contact lp-contact-composition"><div class="lp-contact-copy"><p class="lp-kicker">{{ eyebrow }}</p><h1>{{ headline }}</h1><p class="lp-lead">{{ intro }}</p><div class="lp-contact-links"><a href="mailto:{{ email }}">{{ email }} ↗</a><a href="{{ phoneUrl }}">{{ phone }} ↗</a><a class="lp-contact-whatsapp" href="{{ whatsappUrl }}">Start on WhatsApp ↗</a></div><p class="lp-kicker">{{ location }}</p><div class="lp-prose">{{{ message }}}</div></div><figure class="lp-living"><div class="lp-living-frame" data-configuration="1" data-roundness="1"><span class="lp-living-shape" aria-hidden="true"></span><span class="lp-living-shape" aria-hidden="true"></span><div class="lp-living-shape lp-living-portrait"><img src="/images/uploads/marine-decas.jpg" alt="Marine Decas, founder of La Perle Panama" width="883" height="1280" decoding="async"></div><span class="lp-living-shape" aria-hidden="true"></span><span class="lp-living-shape" aria-hidden="true"></span><span class="lp-living-shape" aria-hidden="true"></span><span class="lp-living-shape" aria-hidden="true"></span></div><figcaption><span>Marine Decas · Founder</span><button class="lp-living-toggle" type="button" aria-pressed="false" hidden>Pause shapes</button></figcaption></figure></section>

<style>
.lp-contact-composition{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:6vw;align-items:center;padding-top:64px;padding-bottom:64px;min-height:650px}.lp-contact-composition h1{font-size:clamp(44px,5vw,72px)}.lp-contact-composition .lp-contact-links{margin:28px 0;gap:18px}.lp-contact-composition .lp-contact-links a{font-size:clamp(19px,2.1vw,30px)}.lp-contact-composition .lp-contact-links .lp-contact-whatsapp{font:13px Arial,sans-serif;background:#16242c;color:#faf8f4;padding:17px 22px;border:0;margin-top:5px}.lp-contact-composition .lp-prose{font-size:16px;margin-bottom:0}.lp-living{margin:0;min-width:0}.lp-living-frame{position:relative;width:100%;aspect-ratio:1.618;contain:layout paint;isolation:isolate}.lp-living-shape{position:absolute;inset:0;--r:18px;clip-path:inset(var(--y) calc(100% - var(--x) - var(--w)) calc(100% - var(--y) - var(--h)) var(--x) round var(--r));transition:clip-path 750ms ease-in-out}.lp-living-shape:nth-child(1){background:#163c3c;--x:0%;--y:0%;--w:20%;--h:47%}.lp-living-shape:nth-child(2){background:#e8dcc8;--x:22%;--y:0%;--w:21%;--h:47%}.lp-living-shape:nth-child(3){background:#d8c6ac;--x:45%;--y:0%;--w:55%;--h:100%;z-index:0}.lp-living-shape:nth-child(4){background:#b6452f;--x:0%;--y:51%;--w:27%;--h:49%}.lp-living-shape:nth-child(5){background:#bca483;--x:29%;--y:51%;--w:14%;--h:49%}.lp-living-shape:nth-child(6){background:#eee7da;--x:76%;--y:76%;--w:24%;--h:24%;z-index:1}.lp-living-shape:nth-child(7){background:#27605a;--x:89%;--y:87%;--w:11%;--h:13%;z-index:2}.lp-living-portrait img{position:absolute;right:0;top:0;width:60%;height:100%;object-fit:cover;object-position:50% 25%;max-width:none}
.lp-living-frame[data-configuration="2"] .lp-living-shape:nth-child(1){--x:0%;--y:15%;--w:16%;--h:85%}.lp-living-frame[data-configuration="2"] .lp-living-shape:nth-child(2){--x:18%;--y:0%;--w:20%;--h:40%}.lp-living-frame[data-configuration="2"] .lp-living-shape:nth-child(3){--x:40%;--y:4%;--w:48%;--h:92%}.lp-living-frame[data-configuration="2"] .lp-living-shape:nth-child(4){--x:18%;--y:44%;--w:20%;--h:34%}.lp-living-frame[data-configuration="2"] .lp-living-shape:nth-child(5){--x:18%;--y:82%;--w:20%;--h:18%}.lp-living-frame[data-configuration="2"] .lp-living-shape:nth-child(6){--x:90%;--y:0%;--w:10%;--h:65%}.lp-living-frame[data-configuration="2"] .lp-living-shape:nth-child(7){--x:90%;--y:69%;--w:10%;--h:31%}
.lp-living-frame[data-configuration="3"] .lp-living-shape:nth-child(1){--x:0%;--y:8%;--w:17%;--h:30%}.lp-living-frame[data-configuration="3"] .lp-living-shape:nth-child(2){--x:19%;--y:0%;--w:21%;--h:55%}.lp-living-frame[data-configuration="3"] .lp-living-shape:nth-child(3){--x:42%;--y:0%;--w:58%;--h:100%}.lp-living-frame[data-configuration="3"] .lp-living-shape:nth-child(4){--x:0%;--y:42%;--w:17%;--h:58%}.lp-living-frame[data-configuration="3"] .lp-living-shape:nth-child(5){--x:19%;--y:59%;--w:21%;--h:41%}.lp-living-frame[data-configuration="3"] .lp-living-shape:nth-child(6){--x:76%;--y:78%;--w:24%;--h:22%}.lp-living-frame[data-configuration="3"] .lp-living-shape:nth-child(7){--x:87%;--y:85%;--w:13%;--h:15%}
.lp-living-frame[data-roundness="2"] .lp-living-shape{--r:0px}.lp-living-frame[data-roundness="3"] .lp-living-shape{--r:50%}.lp-living-frame[data-roundness="4"] .lp-living-shape{--r:0 32% 0 32%}.lp-living-frame[data-roundness="4"] .lp-living-shape:nth-child(even){--r:32% 0 32% 0}.lp-living figcaption{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;min-height:32px;font-size:11px;letter-spacing:.06em}.lp-living-toggle{font:inherit;color:#163c3c;background:transparent;border:1px solid #d8c6ac;padding:7px 10px;cursor:pointer}.lp-living-toggle:focus-visible{outline:2px solid #b6452f;outline-offset:3px}
@media(max-width:1100px){.lp-contact-composition{gap:4vw;padding-inline:4vw}.lp-contact-composition .lp-contact-links a{font-size:20px}}
@media(max-width:767px){.lp-contact-composition{grid-template-columns:1fr;padding:40px 24px;gap:40px;min-height:0}.lp-living{width:100%;max-width:560px;margin:auto}}
@media(prefers-reduced-motion:reduce){.lp-living-shape{transition:none}.lp-living-toggle{display:none}}
</style>
<script>
(()=>{const frame=document.querySelector('.lp-living-frame'),button=document.querySelector('.lp-living-toggle'),reduce=matchMedia('(prefers-reduced-motion: reduce)');if(!frame||!('IntersectionObserver' in window))return;let visible=false,paused=false,timer=0,step=0;
const sync=()=>{clearInterval(timer);timer=0;button.hidden=reduce.matches;if(reduce.matches){step=0;frame.dataset.configuration='1';frame.dataset.roundness='1'}if(visible&&!document.hidden&&!reduce.matches&&!paused)timer=setInterval(()=>{step++;frame.dataset.configuration=String(step%3+1);frame.dataset.roundness=String(step%4+1)},3000)};
new IntersectionObserver(([entry])=>{visible=entry.isIntersecting;sync()},{threshold:0}).observe(frame);document.addEventListener('visibilitychange',sync);reduce.addEventListener('change',sync);button.addEventListener('click',()=>{paused=!paused;button.textContent=paused?'Resume shapes':'Pause shapes';button.setAttribute('aria-pressed',String(paused));sync()});sync()})();
</script>
